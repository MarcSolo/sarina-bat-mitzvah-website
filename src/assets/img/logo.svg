<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#6d28d9" stroke-width="2"/>
  
  <!-- Decorative teal circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
  
  <!-- Star symbol (representing bat mitzvah coming of age) -->
  <path d="M100 30 L115 70 L160 70 L125 100 L140 140 L100 110 L60 140 L75 100 L40 70 L85 70 Z" fill="#6d28d9"/>
  
  <!-- Hebrew letter Shin (ש) as accent - simplified geometric version -->
  <g transform="translate(100, 140)">
    <rect x="-12" y="0" width="8" height="20" fill="#0d9488"/>
    <rect x="4" y="0" width="8" height="20" fill="#0d9488"/>
    <rect x="-4" y="8" width="8" height="20" fill="#0d9488"/>
  </g>
  
  <!-- Text: "SARINA" -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#6d28d9">
    SARINA
  </text>
</svg>
