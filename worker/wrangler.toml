name = "sarina-bat-mitzvah-worker"
main = "src/index.js"
compatibility_date = "2024-09-24"

[env.production]
routes = [
  { pattern = "sarinabatmitzvah.com/api/*", zone_name = "sarinabatmitzvah.com" }
]

[env.development]
routes = [
  { pattern = "*/api/*" }
]

[[r2.buckets]]
binding = "BUCKET"
bucket_name = "sarina-rsvps"

[triggers]
crons = []
